# cargo-deny 0.20 — advisory (RustSec) + kaynak + yasaklar. Lisans denetimi ayrı karar (docs/DECISIONS.md ADR-06).
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[bans]
